<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600"><rect width="1040" height="600" fill="#f6f8fb" /><text x="36" y="42" font-size="24" fill="#243047">GraphSAGE Link Prediction</text><text x="36" y="72" font-size="13" fill="#596579">Ranking metrics use the same held-out test edges and train-visible skill candidates</text><text x="36" y="116" font-size="18" fill="#243047">Ranking</text><text x="36" y="157" font-size="14" fill="#243047">Precision@10</text><rect x="180" y="157" width="21" height="16" rx="2" fill="#187b8f" /><text x="574" y="170" font-size="12" fill="#243047">GraphSAGE: 0.0549</text><rect x="180" y="181" width="23" height="16" rx="2" fill="#cf6a3a" /><text x="574" y="194" font-size="12" fill="#243047">Frequency: 0.0601</text><rect x="180" y="205" width="23" height="16" rx="2" fill="#4b8c5a" /><text x="574" y="218" font-size="12" fill="#243047">Co-occurrence: 0.0618</text><text x="36" y="269" font-size="14" fill="#243047">Recall@10</text><rect x="180" y="269" width="101" height="16" rx="2" fill="#187b8f" /><text x="574" y="282" font-size="12" fill="#243047">GraphSAGE: 0.2650</text><rect x="180" y="293" width="111" height="16" rx="2" fill="#cf6a3a" /><text x="574" y="306" font-size="12" fill="#243047">Frequency: 0.2909</text><rect x="180" y="317" width="114" height="16" rx="2" fill="#4b8c5a" /><text x="574" y="330" font-size="12" fill="#243047">Co-occurrence: 0.2993</text><text x="36" y="381" font-size="14" fill="#243047">NDCG@10</text><rect x="180" y="381" width="77" height="16" rx="2" fill="#187b8f" /><text x="574" y="394" font-size="12" fill="#243047">GraphSAGE: 0.2025</text><rect x="180" y="405" width="89" height="16" rx="2" fill="#cf6a3a" /><text x="574" y="418" font-size="12" fill="#243047">Frequency: 0.2331</text><rect x="180" y="429" width="92" height="16" rx="2" fill="#4b8c5a" /><text x="574" y="442" font-size="12" fill="#243047">Co-occurrence: 0.2420</text><text x="700" y="116" font-size="17" fill="#243047">Sampled-negative link classification</text><text x="700" y="178" font-size="14" fill="#243047">ROC-AUC</text><rect x="700" y="190" width="203" height="20" rx="2" fill="#187b8f" /><text x="970" y="206" font-size="12" fill="#243047">0.7795</text><text x="700" y="256" font-size="14" fill="#243047">Average precision</text><rect x="700" y="268" width="223" height="20" rx="2" fill="#187b8f" /><text x="970" y="284" font-size="12" fill="#243047">0.8568</text><text x="36" y="548" font-size="12" fill="#596579">ROC-AUC/AP use 1:1 sampled negatives; all known positive pairs were excluded from negative sampling.</text><text x="36" y="572" font-size="12" fill="#596579">The existing Phase 3.2 full-holdout results are reported separately because their evaluation split differs.</text></svg>